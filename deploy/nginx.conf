# /etc/nginx/sites-available/moto-smolensk  (ln -s в sites-enabled)
# HTTPS: certbot --nginx -d moto-smolensk.ru -d www.moto-smolensk.ru
limit_req_zone $binary_remote_addr zone=lead:10m rate=10r/m;

server {
    listen 80;
    server_name moto-smolensk.ru www.moto-smolensk.ru;
    root /srv/moto-smolensk/web;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; media-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # хэшированные ассеты Astro и обработанные фото не меняются: кэш на год
    location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /img/    { expires 30d; add_header Cache-Control "public"; }

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    error_page 404 /404.html;

    location /api/ {
        limit_req zone=lead burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
